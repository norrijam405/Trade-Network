services:
  - type: web
    name: trade-network-r3-persistent-preview
    runtime: python
    plan: free
    region: ohio
    repo: https://github.com/norrijam405/Trade-Network
    branch: launch/r2-hosted-preview
    autoDeploy: false
    buildCommand: pip install -r requirements-preview.txt
    startCommand: uvicorn preview_runner:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trade-network-r2-pilot-db
          property: connectionString
      - key: TRADE_NETWORK_PERSISTENCE_MODE
        value: render-postgres-preview
