name: Trade Network Preview Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  preview-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-preview.txt
            requirements-dev.txt
      - name: Install preview and test dependencies
        run: python -m pip install -r requirements-preview.txt -r requirements-dev.txt
      - name: Compile runtime
        run: python -m py_compile hosted_preview.py preview_runner.py
      - name: Run isolation and workflow tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q
      - name: Build container
        run: docker build -t trade-network-preview .
